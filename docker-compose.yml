version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indic_sentiment_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Multilingual Sentiment and Feedback Analytics for Indian Languages
      - VERSION=1.0.0
      - SECRET_KEY=indic-secret-jwt-key-prod-random-token-998877
      - DATABASE_URL=sqlite:///./sentiment.db
      - MODEL_NAME=cardiffnlp/twitter-xlm-roberta-base-sentiment-multilingual
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - FAST_NLP=0
    volumes:
      - sentiment_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  sentiment_data:
